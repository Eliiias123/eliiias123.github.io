<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect width="400" height="260" fill="#2b2b2b"/>
  <!-- Water drops background -->
  <circle cx="60" cy="40" r="6" fill="rgba(255,255,255,0.06)"/>
  <circle cx="340" cy="80" r="10" fill="rgba(255,255,255,0.04)"/>
  <circle cx="200" cy="220" r="14" fill="rgba(255,255,255,0.04)"/>
  <circle cx="30" cy="200" r="8" fill="rgba(255,255,255,0.06)"/>
  <circle cx="370" cy="200" r="6" fill="rgba(255,255,255,0.06)"/>
  <!-- Car body -->
  <rect x="80" y="140" width="240" height="60" rx="8" fill="#444"/>
  <path d="M120 140 Q140 100 180 95 L220 95 Q260 100 280 140Z" fill="#444"/>
  <!-- Windows -->
  <path d="M130 138 Q145 108 175 104 L195 104 L195 138Z" fill="#1a1a1a"/>
  <path d="M205 138 L205 104 L225 104 Q255 108 270 138Z" fill="#1a1a1a"/>
  <!-- Wheels -->
  <circle cx="130" cy="200" r="22" fill="#1a1a1a"/>
  <circle cx="130" cy="200" r="12" fill="#333"/>
  <circle cx="270" cy="200" r="22" fill="#1a1a1a"/>
  <circle cx="270" cy="200" r="12" fill="#333"/>
  <!-- Water spray lines -->
  <line x1="50" y1="60" x2="50" y2="190" stroke="#5ab4ff" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>
  <line x1="70" y1="50" x2="70" y2="190" stroke="#5ab4ff" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
  <line x1="350" y1="60" x2="350" y2="190" stroke="#5ab4ff" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>
  <line x1="330" y1="50" x2="330" y2="190" stroke="#5ab4ff" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="3">BASIC WASH</text>
</svg>
