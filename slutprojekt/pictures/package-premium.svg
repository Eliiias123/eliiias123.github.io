<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect width="400" height="260" fill="#c8102e"/>
  <!-- Foam bubbles -->
  <circle cx="55" cy="50" r="18" fill="rgba(255,255,255,0.08)"/>
  <circle cx="345" cy="70" r="14" fill="rgba(255,255,255,0.07)"/>
  <circle cx="310" cy="210" r="20" fill="rgba(255,255,255,0.06)"/>
  <circle cx="80" cy="210" r="16" fill="rgba(255,255,255,0.07)"/>
  <circle cx="200" cy="30" r="10" fill="rgba(255,255,255,0.08)"/>
  <!-- Car body -->
  <rect x="80" y="140" width="240" height="60" rx="8" fill="rgba(0,0,0,0.35)"/>
  <path d="M120 140 Q140 100 180 95 L220 95 Q260 100 280 140Z" fill="rgba(0,0,0,0.35)"/>
  <!-- Windows -->
  <path d="M130 138 Q145 108 175 104 L195 104 L195 138Z" fill="rgba(0,0,0,0.5)"/>
  <path d="M205 138 L205 104 L225 104 Q255 108 270 138Z" fill="rgba(0,0,0,0.5)"/>
  <!-- Wheels -->
  <circle cx="130" cy="200" r="22" fill="rgba(0,0,0,0.4)"/>
  <circle cx="130" cy="200" r="12" fill="rgba(0,0,0,0.3)"/>
  <circle cx="270" cy="200" r="22" fill="rgba(0,0,0,0.4)"/>
  <circle cx="270" cy="200" r="12" fill="rgba(0,0,0,0.3)"/>
  <!-- Foam brush -->
  <rect x="160" y="55" width="16" height="85" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="182" y="45" width="16" height="95" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="204" y="55" width="16" height="85" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="226" y="50" width="16" height="90" rx="4" fill="rgba(255,255,255,0.18)"/>
  <!-- Shine highlight on car -->
  <path d="M155 110 Q175 105 195 110" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <!-- Label -->
  <text x="200" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="3">PREMIUM WASH</text>
</svg>
